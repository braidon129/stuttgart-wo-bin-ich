/* Layout: one-screen app. Status plate on top (street-sign feel) with a border countdown, map fills the rest, controls float at the bottom. Single dark look. */
:root {
  color-scheme: dark;
  --bg: #0d0f12;
  --panel: #16191e;
  --line: #2a2f37;
  --fg: #f2f1ec;
  --muted: #9a9ca3;
  --sign: #1f5fa8;      /* Stuttgarter Straßenschild-Blau */
  --calm: #8fb6e8;
  --green: #6fae3a;
  --warn: #e0a43a;
  --edge: #ff6b5a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  display: flex; flex-direction: column; overflow: hidden;
}
.plate {
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
  display: grid; gap: 8px;
}
.row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.bez { font: 600 15px/1.1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--muted); flex: none; }
.teil { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; cursor: pointer; }
.vtrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 500 12.5px/1.2 var(--body); color: var(--muted); opacity: .85; }
.vtrow:empty { display: none; }
.vtrow b { font: 600 12.5px/1 var(--mono); color: var(--muted); }
.vtrow .only { font: 500 12px/1 var(--body); color: var(--muted); }
.plate.is-mini .vtrow { display: none; }
.tag { font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; }
.tag.green { color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 55%, transparent); }
.row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.next .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.next .head .eyebrow { color: var(--c); }
.gpswarn { font: 500 12.5px/1.3 var(--body); color: var(--warn); }
.mini { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font: 600 15px/1.2 var(--display); }
.mini b { font: 700 18px/1 var(--mono); color: var(--calm); }
.plate.is-mini .row1, .plate.is-mini .addr, .plate.is-mini .next, .plate.is-mini .gpswarn { display: none !important; }
.plate:not(.is-mini) .mini { display: none; }
.plate.is-mini .teil .name { font-size: 24px; }
.fold { margin-left: auto; font: 600 12px/1 var(--body); color: var(--muted); background: none; border: 0; padding: 4px; cursor: pointer; }
.nbpill { --c: #8fb6e8; transform: translate(-50%, -50%); display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
  font: 600 13px/1 var(--body); color: #fff; background: rgba(13,15,18,.86); border: 1.5px solid var(--c); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.nbpill b { font: 700 13px/1 var(--mono); color: var(--c); }
.nbpill.goal { background: #1f5fa8; border-color: #fff; --c: #fff; }
.lbl { font: 500 14px/1 var(--body); color: var(--muted); letter-spacing: .01em; }
.bez #bez { font: 600 17px/1.1 var(--display); }
.bez .swatch { display: none; }
.teil .tlbl { flex-basis: 100%; }
.plate.is-mini .teil .tlbl { display: none; }
.teil .name { font: 700 clamp(30px, 9vw, 44px)/1 var(--display); text-wrap: balance; overflow-wrap: anywhere; min-width: 0; }

.next {
  --c: var(--calm);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px;
  padding: 10px 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  color: var(--c); transition: border-color .3s, color .3s;
}
.next[data-state="near"] { --c: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }

function chip(html, cls = "") { const s = document.createElement("span"); s.className = "chip " + cls; s.innerHTML = html; return s; }

let shownD = null, tween = null;
function animateDistance(target) {
  cancelAnimationFrame(tween);
  if (shownD === null || REDUCED) { shownD = target; $("nextD").textContent = Math.round(target); return; }
  const from = shownD, t0 = performance.now(), dur = 450;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    shownD = from + (target - from) * e;
    $("nextD").textContent = Math.round(shownD);
    if (k < 1) tween = requestAnimationFrame(step);
  };
  tween = requestAnimationFrame(step);
}

let history = [], lastTeil = null, lastViertel = null, toastTimer = null;
function toast(main, sub) {
  const t = $("toast");
  t.innerHTML = main + (sub ? `<small>${sub}</small>` : "");
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function trendText(d, moving) {
  if (!moving) return "";
  const now = Date.now();
  history.push({ t: now, d }); history = history.filter(h => now - h.t < 6000);
  if (history.length < 2) return "";
  const delta = history[history.length - 1].d - history[0].d;
  if (delta < -2) return "↓ du kommst näher";
  if (delta > 2) return "↑ du entfernst dich";
  return "– gleichbleibend";
}

let target = null, targetStart = null, lastPt = DEMO;
// Volksnamen nur dort, wo sie geprüft deckungsgleich mit einem Stadtviertel sind
const VNAME = { "1021": "Bohnenviertel", "1022": "Gerberviertel" };
const VCOUNT = {}; GEO.viertel.forEach(v => { const k = v.nr.slice(0, 3); VCOUNT[k] = (VCOUNT[k] || 0) + 1; });
// heading: direction of travel (GPS), else compass, else manual (tap the arrow)
let heading = 0, headingSrc = "manuell", lastMoveTs = 0, compassHdg = null, compassTs = 0;
let lastFix = null, lastAcc = 0, lastSource = "Stadtmitte";
function blendAngle(a, b, k) {
  if (a === null) return b;
  const d = ((b - a + 540) % 360) - 180;
  return (a + d * k + 360) % 360;
}
function currentHeading() {
  if (Date.now() - lastMoveTs < 5000) return;
  if (compassHdg !== null && Date.now() - compassTs < 2000) { heading = compassHdg; headingSrc = "Kompass"; }
}
const targetLayer = L.polygon([], { color: "#8fb6e8", weight: 3, dashArray: "6 6", fill: false, interactive: false }).addTo(map);
function setTarget(t, pt) {
  target = t; history = [];
  targetLayer.setLatLngs(t ? ll(t.g) : []);
  targetStart = t ? nearestOnBoundary(pt, t.g).d : null;
  $("clearTarget").hidden = !t;
  if (t) toast(`Ziel: ${t.name}`, `${Math.round(targetStart)} m bis zur Grenze`);
}
// nächste Stadtteile mit kürzester Entfernung (egal welcher Bezirk)
function neighbours(pt, current) {
  return GEO.teile.filter(t => t !== current && bboxDist(pt, t.bb) < 800)
    .map(t => { const n = nearestOnBoundary(pt, t.g); return { t, d: n.d, p: n.p }; })
    .filter(x => x.d < 800).sort((a, b) => a.d - b.d).slice(0, 5);
}
// Meter-Schilder direkt an den Nachbar-Stadtteilen auf der Karte
const pills = new Map();
function renderPills(pt, list) {
  const keep = new Set();
  for (const x of list) {
    const nr = x.t.nr; keep.add(nr);
    // Schild hinter die Grenze setzen, aber immer mind. 80 px vom eigenen Pfeil entfernt
    const me0 = map.latLngToContainerPoint([pt[1], pt[0]]);
    let bp = map.latLngToContainerPoint([x.p[1], x.p[0]]);
    let vx = bp.x - me0.x, vy = bp.y - me0.y, len = Math.hypot(vx, vy);
    if (len < 1) { vx = 0; vy = -1; len = 1; }
    const want = Math.max(len + 30, 80);
    const posPx = L.point(me0.x + vx / len * want, me0.y + vy / len * want);
    const ll0 = map.containerPointToLatLng(posPx);
    const pos = [ll0.lng, ll0.lat];
    const html = `<div class="nbpill${target === x.t ? " goal" : ""}">${esc(x.t.name)} <b>${Math.round(x.d)} m</b></div>`;
    let m = pills.get(nr);
    if (!m) {
      m = L.marker([pos[1], pos[0]], { icon: L.divIcon({ className: "", html, iconSize: null }), keyboard: false, zIndexOffset: 500 }).addTo(map);
      m.on("click", ev => { L.DomEvent.stop(ev); const t = GEO.teile.find(o => o.nr === nr); setTarget(target === t ? null : t, lastPt); render(lastPt, lastSource, lastAcc, false); });
      pills.set(nr, m);
    } else {
      m.setLatLng([pos[1], pos[0]]);
      const el = m.getElement(); if (el) el.innerHTML = html;
    }
  }
  for (const [nr, m] of pills) if (!keep.has(nr)) { m.remove(); pills.delete(nr); }
}

function render(pt, source, accuracy, moving) {
  lastPt = pt;
  const r = locate(pt);
  if (target && r.teil === target) {
    toast(`Ziel erreicht: ${target.name}`, "");
    try { navigator.vibrate && navigator.vibrate([120, 60, 120, 60, 120]); } catch (e) {}
    setTarget(null, pt);
  }
  if (addrCache && !$("addr").hidden && distM(addrCache.pt, pt) > 25) $("addr").hidden = true;
  me.setLatLng([pt[1], pt[0]]);
  hdgMarker.setLatLng([pt[1], pt[0]]);
  const mh = document.getElementById("meHdg"); if (mh) mh.style.transform = `rotate(${Math.round(heading)}deg)`;
  acc.setLatLng([pt[1], pt[0]]).setRadius(accuracy || 0);
  if (highlighted) { highlighted.setStyle({ fillOpacity: .32 }); teilOutlines[highlightedNr].setStyle({ weight: 2, color: "#e9e7df" }); }
  highlighted = r.teil ? teilLayers[r.teil.nr] : null;
  highlightedNr = r.teil ? r.teil.nr : null;
  if (highlighted) { highlighted.setStyle({ fillOpacity: .55 }); teilOutlines[highlightedNr].setStyle({ weight: 3.5, color: "#ffffff" }).bringToFront(); }

  // nur Stadtteil-Wechsel melden
  if (moving && r.teil && lastTeil && r.teil.nr !== lastTeil) {
    toast(`Neuer Stadtteil: ${r.teil.name}`, "");
    try { navigator.vibrate && navigator.vibrate([90, 50, 90]); } catch (e) {}
    history = [];
  }
  lastTeil = r.teil ? r.teil.nr : null; lastViertel = r.viertel ? r.viertel.nr : null;

  // oben: Bezirk (live), Stadtteil, Viertel
  if (r.bez) { $("swatch").style.background = COL[r.bez.nr]; $("bez").textContent = r.bez.name; }
  else { $("swatch").style.background = "var(--muted)"; $("bez").textContent = "außerhalb von Stuttgart"; }
  $("tname").textContent = r.teil ? r.teil.name : "Kein Stadtgebiet";
  $("vt").innerHTML = r.viertel ? `<span>Stadtviertel <b>${r.viertel.nr}</b>${VNAME[r.viertel.nr] ? ` (${VNAME[r.viertel.nr]})` : ""}</span>`
    + (r.viertel.nr.endsWith("9") ? `<span class="tag green">Grünfläche</span>` : "")
    + (VCOUNT[r.teil.nr] === 1 ? `<span class="only">einziges Viertel im Stadtteil</span>` : "") : "";

  // Kasten: geradeaus bis zum nächsten Stadtteil, oder Luftlinie zum Ziel
  let b = null;
  if (target) {
    const n = nearestOnBoundary(pt, target.g);
    b = { d: n.d, p: n.p, other: target };
    $("nextLbl").textContent = `Ziel · ${dirName(bearingTo(pt, n.p))}`;
  } else {
    const a = castAhead(pt, heading);
    if (a && (a.other || r.teil)) b = { d: a.d, p: a.p, other: a.other };
    const how = headingSrc === "Bewegung" ? "Geradeaus" : headingSrc === "Kompass" ? "Blickrichtung" : "Pfeilrichtung";
    $("nextLbl").textContent = `${how} · ${dirName(heading)}`;
  }
  $("rotBtn").hidden = !!target || headingSrc !== "manuell";
  if (b) {
    $("next").hidden = false;
    $("next").dataset.goal = String(!!target);
    $("nextTo").textContent = b.other ? b.other.name : "Stadtgrenze";
    animateDistance(b.d);
    const prog = target ? (targetStart > 0 ? 1 - b.d / targetStart : 1) : 1 - b.d / 300;
    $("bar").style.width = Math.max(2, Math.min(100, prog * 100)) + "%";
    $("next").dataset.state = b.d < 15 ? "edge" : b.d < 50 ? "near" : "calm";
    $("trend").textContent = trendText(b.d, moving);
    borderLine.setLatLngs([[pt[1], pt[0]], [b.p[1], b.p[0]]]);
    borderPt.setLatLng([b.p[1], b.p[0]]).addTo(map);
    $("miniTxt").textContent = `${$("nextLbl").textContent.split(" · ")[0]}: ${b.other ? b.other.name : "Stadtgrenze"}`;
    $("miniD").textContent = `${Math.round(b.d)} m`;
  } else {
    $("next").hidden = true; borderLine.setLatLngs([]); borderPt.remove();
    $("miniTxt").textContent = ""; $("miniD").textContent = "";
  }

  // Meter zu den nächsten Stadtteilen direkt auf der Karte
  const nb = neighbours(pt, r.teil), show = nb.slice(0, 1);
  if (target && !show.some(x => x.t === target)) {
    const n = nearestOnBoundary(pt, target.g); show.push({ t: target, d: n.d, p: n.p });
  }
  renderPills(pt, show);

  // GPS nur melden, wenn es ungenau ist
  const warn = accuracy && accuracy > 20;
  $("gpswarn").hidden = !warn;
  if (warn) $("gpswarn").textContent = `GPS ungenau (±${Math.round(accuracy)} m). Meter nahe einer Grenze können abweichen.`;
}

map.on("click", e => {
  const p = [e.latlng.lng, e.latlng.lat];
  if (watchId !== null || simTimer !== null) {
    const t = find(GEO.teile, p), cur = find(GEO.teile, lastPt);
    if (t && t !== cur) { setTarget(target === t ? null : t, lastPt); render(lastPt, lastSource, lastAcc, false); }
    return;
  }
  history = []; lastSource = "Kartenpunkt"; lastAcc = 0; render(p, "Kartenpunkt");
});
$("clearTarget").addEventListener("click", () => { setTarget(null, lastPt); render(lastPt, lastSource, lastAcc, false); });
function toggleFold(ev) {
  if (ev && ev.target.closest("button:not(#fold)")) return;
  const mini = $("plate").classList.toggle("is-mini");
  $("fold").textContent = mini ? "▾" : "▴";
  $("fold").setAttribute("aria-label", mini ? "Kopfbereich ausklappen" : "Kopfbereich einklappen");
  setTimeout(() => map.invalidateSize(), 50);
}
$("teilRow").addEventListener("click", toggleFold);
$("mini").addEventListener("click", toggleFold);

// ---------- live GPS ----------
let watchId = null, follow = true, wake = null;
function setMsg(t) { $("msg").textContent = t || ""; $("msg").hidden = !t; }
async function startLive(auto) {
  stopSim();
  if (!("geolocation" in navigator)) { setMsg("Dieser Browser liefert keinen Standort. Tippe auf die Karte oder nutze den Testlauf."); return; }
  setMsg(""); history = [];
  $("live").setAttribute("aria-pressed", "true"); $("live").classList.add("live"); $("liveTxt").textContent = "Live · stoppen";
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) { wake = null; }
  enableCompass();
  watchId = navigator.geolocation.watchPosition(p => {
    const pt = [p.coords.longitude, p.coords.latitude], c = p.coords;
    const moved = lastFix && distM(lastFix, pt) > Math.max(4, (c.accuracy || 0) * 0.6);
    if (c.heading !== null && !isNaN(c.heading) && c.speed > 0.8) {
      heading = blendAngle(heading, c.heading, 0.6); headingSrc = "Bewegung"; lastMoveTs = Date.now();
    } else if (moved) {
      heading = blendAngle(heading, bearingTo(lastFix, pt), 0.5); headingSrc = "Bewegung"; lastMoveTs = Date.now();
    } else currentHeading();
    if (!lastFix || moved) lastFix = pt;
    lastAcc = c.accuracy; lastSource = "Live";
    render(pt, "Live", c.accuracy, true);
    if (follow) map.panTo([pt[1], pt[0]], { animate: true });
  }, err => {
    stopLive();
    if (auto) return;
    const where = location.protocol === "https:" ? "" : (/claude\.ai|claudeusercontent/.test(location.host) ? "claude" : "local");
    setMsg(err.code === 1
      ? (window.isSecureContext === false || where === "local"
          ? "Standort gesperrt: Diese Seite ist als lokale Datei geöffnet (" + location.protocol + "). Browser geben GPS nur an https-Adressen heraus. Öffne die Seite über ihre https-Adresse, z. B. GitHub Pages."
          : "Standortzugriff verweigert. In der Claude-App ist GPS gesperrt. Im Browser: Standort für diese Seite erlauben (Schloss-Symbol in der Adresszeile). Bis dahin: Karte antippen oder Testlauf.")
      : "Standort gerade nicht verfügbar. Versuche es draußen erneut oder tippe auf die Karte.");
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
function stopLive() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  $("live").setAttribute("aria-pressed", "false"); $("live").classList.remove("live"); $("liveTxt").textContent = "Live starten";
  try { wake && wake.release(); } catch (e) {} wake = null;
}

// ---------- Adresse (nur auf Knopfdruck, über OpenStreetMap Nominatim) ----------
// Regeln: Straße + PLZ immer; Hausnummer nur als "bei Nr." wenn GPS ≤ ±20 m und Adresse ≤ 30 m entfernt;
// Straße weiter als 50 m entfernt -> "Nächste Straße … ca. X m entfernt"; Wald-/Parkname, wenn man darin steht.
let addrBusy = false, addrCache = null;
const NOMI = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&polygon_geojson=1&polygon_threshold=0.00002";
const AREA_CATS = new Set(["natural", "landuse", "leisure", "boundary", "tourism"]);
const AREA_TYPES = { wood: "Wald", forest: "Wald", nature_reserve: "Naturschutzgebiet", protected_area: "Schutzgebiet", park: "Park",
  garden: "Garten", grassland: "Wiese", meadow: "Wiese", heath: "Heide", vineyard: "Weinberg", orchard: "Streuobstwiese",
  scrub: "Gebüsch", cemetery: "Friedhof", allotments: "Kleingärten", recreation_ground: "Freizeitgelände", zoo: "Zoo" };
function geomToRings(geo) {
  if (!geo || !geo.type) return null;
  if (geo.type === "Point") return { pt: geo.coordinates };
  if (geo.type === "LineString") return { lines: [[geo.coordinates]] };
  if (geo.type === "MultiLineString") return { lines: [geo.coordinates] };
  if (geo.type === "Polygon") return { poly: [geo.coordinates] };
  if (geo.type === "MultiPolygon") return { poly: geo.coordinates };
  return null;
}
// metres from pt to the found object (0 when standing inside an area)
function geoDist(pt, geo, fallback) {
  const r = geomToRings(geo);
  if (!r) return fallback ? distM(pt, fallback) : Infinity;
  if (r.pt) return distM(pt, r.pt);
  if (r.lines) return nearestOnBoundary(pt, r.lines).d;
  return inGeom(pt, r.poly) ? 0 : nearestOnBoundary(pt, r.poly).d;
}
const round10 = m => Math.max(10, Math.round(m / 10) * 10);
async function nomi(params) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
  try {
    const res = await fetch(NOMI + params, { signal: ctl.signal, headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(to); }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function showAddr(st, city, area, far, hood) {
  $("addrStreet").innerHTML = st; $("addrCity").textContent = city;
  $("addrHood").innerHTML = hood ? `Gegend: <b>${esc(hood)}</b> <span style="color:var(--muted)">(OpenStreetMap)</span>` : ""; $("addrHood").hidden = !hood;
  $("addrArea").textContent = area || ""; $("addrArea").hidden = !area;
  $("addr").dataset.far = String(!!far); $("addr").hidden = false;
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("addrBtn").addEventListener("click", async () => {
  if (addrBusy) return;
  const pt = lastPt;
  if (addrCache && distM(addrCache.pt, pt) < 10) { showAddr(addrCache.st, addrCache.city, addrCache.area, addrCache.far, addrCache.hood); return; }
  addrBusy = true; $("addrBtn").setAttribute("aria-busy", "true"); $("addrBtnTxt").textContent = "Sucht …";
  showAddr("Adresse wird gesucht …", "", "", false);
  const q = `&lat=${pt[1].toFixed(6)}&lon=${pt[0].toFixed(6)}`;
  const gpsAcc = lastSource === "Live" ? (lastAcc || 0) : 0;
  try {
    // 1) nächste Adresse bzw. Straße
    const j = await nomi(q + "&zoom=18&addressdetails=1");
    const a = j.address || {};
    let road = a.road || a.pedestrian || a.footway || a.cycleway || a.path || a.bridleway || a.track || a.square;
    if (!road && j.category === "highway" && j.name) road = j.name;
    const d = geoDist(pt, j.geojson, j.lat ? [+j.lon, +j.lat] : null);
    let area = "";
    if (AREA_CATS.has(j.category) && j.name && d === 0) area = `${AREA_TYPES[j.type] || "Gebiet"}: ${j.name}`;
    // 2) Wald/Park, in dem man steht (nur wenn keine Hausadresse direkt daneben)
    if (!area && !(a.house_number && d <= 30)) {
      try {
        await wait(1100);                                   // Nominatim: max. 1 Anfrage pro Sekunde
        const n = await nomi(q + "&zoom=15&layer=natural,poi");
        if (n && n.name && AREA_CATS.has(n.category) && geoDist(pt, n.geojson, null) === 0)
          area = `${AREA_TYPES[n.type] || "Gebiet"}: ${n.name}`;
      } catch (e) { /* Zusatzinfo, Fehler ignorieren */ }
    }
    let st, far = false;
    if (!road) { st = "Keine Straße in der Nähe"; far = true; }
    else if (d > 50) { st = `Nächste Straße: ${esc(road)} <small>ca. ${round10(d)} m entfernt</small>`; far = true; }
    else {
      const showNr = a.house_number && d <= 30 && gpsAcc <= 20;
      st = esc(road) + (showNr ? ` <small>bei Nr. ${esc(a.house_number)}</small>` : "");
    }
    const city = [a.postcode, a.city || a.town || a.village || a.municipality].filter(Boolean).join(" ")
      + (gpsAcc ? ` · GPS ±${Math.round(gpsAcc)} m` : "") + (gpsAcc > 20 ? " · zu ungenau für Hausnummer" : "");
    const hood = a.quarter || a.neighbourhood || "";
    addrCache = { pt, st, city, area, far, hood };
    showAddr(st, city, area, far, hood);
  } catch (e) {
    showAddr("Adresse gerade nicht abrufbar", location.protocol === "https:" && location.hostname.endsWith("github.io")
      ? "Keine Verbindung zum Adressdienst. Prüfe das Internet und tippe erneut."
      : "In dieser Ansicht ist der Adressdienst gesperrt. In der GitHub-Version funktioniert es.", "", true);
  } finally {
    setTimeout(() => { addrBusy = false; $("addrBtn").setAttribute("aria-busy", "false"); $("addrBtnTxt").textContent = "Adresse"; }, 1200);
  }
});

// ---------- compass ----------
let compassOn = false, refreshTimer = null;
function refresh() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; render(lastPt, lastSource, lastAcc, false); }, 150);
}
function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha !== null) h = 360 - e.alpha;
  if (h === null) return;
  h = (h + ((screen.orientation && screen.orientation.angle) || 0)) % 360;
  compassHdg = blendAngle(compassHdg, h, 0.25); compassTs = Date.now();
  if (Date.now() - lastMoveTs > 5000 && simTimer === null) { heading = compassHdg; headingSrc = "Kompass"; refresh(); }
}
async function enableCompass() {
  if (compassOn) return; compassOn = true;
  try { if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", onOrient);
  else window.addEventListener("deviceorientation", onOrient);
}
$("rotBtn").addEventListener("click", () => {
  if (target) return;
  heading = (Math.round(heading / 45) * 45 + 45) % 360; headingSrc = "manuell"; lastMoveTs = 0; compassTs = 0;
  render(lastPt, lastSource, lastAcc, false);
});

// ---------- Testlauf ----------
let simTimer = null;
function startSim() {
  stopLive(); setMsg(""); history = []; lastTeil = null; lastViertel = null;
  $("sim").setAttribute("aria-pressed", "true"); $("sim").textContent = "Testlauf stoppen";
  const pts = [];
  for (let i = 0; i < SIM_PATH.length - 1; i++) for (let k = 0; k < 12; k++) {
    const a = SIM_PATH[i], b = SIM_PATH[i + 1], t = k / 12;
    pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
  pts.push(SIM_PATH[SIM_PATH.length - 1]);
  let i = 0;
  const tick = () => {
    if (i >= pts.length) { stopSim(); return; }
    if (i > 0) { heading = bearingTo(pts[i - 1], pts[i]); headingSrc = "Bewegung"; lastMoveTs = Date.now(); }
    lastSource = "Testlauf"; lastAcc = 0;
    render(pts[i], "Testlauf", 0, true);
    if (follow) map.panTo([pts[i][1], pts[i][0]], { animate: true });
    i++; simTimer = setTimeout(tick, 650);
  };
  tick();
}
function stopSim() {
  clearTimeout(simTimer); simTimer = null;
  $("sim").setAttribute("aria-pressed", "false"); $("sim").textContent = "Testlauf";
}
function stopAll() { stopLive(); stopSim(); }

$("live").addEventListener("click", () => watchId === null ? startLive() : stopLive());
$("sim").addEventListener("click", () => simTimer === null ? startSim() : stopSim());
$("follow").addEventListener("click", () => {
  follow = !follow; $("follow").setAttribute("aria-pressed", String(follow));
  $("follow").textContent = follow ? "Folgen" : "Folgen aus";
});

render(DEMO, "Stadtmitte");
// Beim Öffnen direkt live gehen, wenn der Browser den Standort erlaubt (oder einmal fragen darf)
(async () => {
  if (!("geolocation" in navigator) || !window.isSecureContext) return;
  let state = "prompt";
  try { state = (await navigator.permissions.query({ name: "geolocation" })).state; } catch (e) {}
  if (state !== "denied") startLive(true);
})();
</script>
</body></html>
