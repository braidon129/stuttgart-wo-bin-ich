/* Layout: one-screen app. Status plate on top (street-sign feel) with a border countdown, map fills the rest, controls float at the bottom. Single dark look. */
:root {
  color-scheme: dark;
  --bg: #0d0f12;
  --panel: #16191e;
  --line: #2a2f37;
  --fg: #f2f1ec;
  --muted: #9a9ca3;
  --sign: #1f5fa8;      /* Stuttgarter Straßenschild-Blau */
  --calm: #8fb6e8;
  --green: #6fae3a;
  --warn: #e0a43a;
  --edge: #ff6b5a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  display: flex; flex-direction: column; overflow: hidden;
}
.plate {
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
  display: grid; gap: 8px;
}
.row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.bez { font: 600 15px/1.1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--muted); flex: none; }
.teil { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.teil .nr { font: 700 22px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.teil .name { font: 700 clamp(30px, 9vw, 44px)/1 var(--display); text-wrap: balance; overflow-wrap: anywhere; min-width: 0; }

.next {
  --c: var(--calm);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px 12px;
  padding: 10px 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  color: var(--c); transition: border-color .3s, color .3s;
}
.next[data-state="near"] { --c: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.next[data-state="edge"] { --c: var(--edge); border-color: color-mix(in srgb, var(--edge) 60%, var(--line)); }
.next[hidden] { display: none; }
.arrow { width: 30px; height: 30px; transition: transform .4s ease; }
.next .to { font: 600 17px/1.1 var(--display); color: var(--fg); overflow-wrap: anywhere; }
.next .dir { font: 500 12px/1.2 var(--body); color: var(--muted); margin-top: 2px; }
.dist { text-align: right; font: 700 34px/1 var(--mono); font-variant-numeric: tabular-nums; }
.dist small { font: 600 14px/1 var(--body); color: var(--muted); margin-left: 2px; }
.trend { font: 500 12px/1.2 var(--body); color: var(--muted); text-align: right; margin-top: 3px; white-space: nowrap; }
.bar { grid-column: 1 / -1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); transition: width .4s ease, background .3s; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.nbs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.nbs::-webkit-scrollbar { display: none; }
.nbs .lab { font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); align-self: center; white-space: nowrap; }
.nb { flex: none; font: 500 13px/1 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; white-space: nowrap; }
.nb b { font: 700 12.5px/1 var(--mono); color: var(--muted); margin-left: 4px; }
.nb[aria-pressed="true"] { border-color: var(--calm); color: var(--calm); }
.nb:focus-visible, .clear:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.clear { font: 600 12px/1 var(--body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; cursor: pointer; margin-left: 6px; }
.next[data-goal="true"] { border-style: dashed; }
.chip { font: 500 12.5px/1 var(--body); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.chip b { font-family: var(--mono); font-weight: 700; }
.chip.green { border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--green); }
.src { font: 400 12px/1.3 var(--body); color: var(--muted); }
.msg { font: 400 12.5px/1.35 var(--body); color: var(--warn); }
#map { flex: 1; min-height: 0; background: var(--bg); }
.leaflet-container { background: var(--bg); font-family: var(--body); }
.tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.75) contrast(.9) saturate(.4); }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: none;
}
.dock button {
  pointer-events: auto; font: 600 15px/1 var(--body); color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 12px 15px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.dock button.primary { background: var(--sign); border-color: var(--sign); color: #fff; }
.dock button[aria-pressed="true"]:not(.primary) { border-color: var(--fg); }
.dock button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
.live .dot { opacity: 1; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

.toast {
  position: fixed; left: 50%; z-index: 1100; transform: translate(-50%, 12px); opacity: 0;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px;
  background: var(--fg); color: var(--bg); font: 600 15px/1.25 var(--body); text-align: center;
  transition: opacity .25s, transform .25s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast small { display: block; font: 500 12px/1.3 var(--body); opacity: .7; margin-top: 2px; }
@media (prefers-reduced-motion: reduce) {
  .live .dot { animation: none; }
  .arrow, .bar i, .toast { transition: none; }
}
.lbl-teil { font: 700 13px/1 var(--display); color: rgba(242,241,236,.55); text-shadow: 0 0 3px #000; white-space: nowrap; letter-spacing: .02em; }
.lbl-v { font: 700 10px/1 var(--mono); color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }
.leaflet-control-attribution { background: rgba(13,15,18,.7) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--fg) !important; border-color: var(--line) !important; }

function inRing(pt, ring) {

}

  acc.setLatLng([pt[1], pt[0]]).setRadius(accuracy || 0);
  if (highlighted) highlighted.setStyle({ fillOpacity: .32, weight: 1.2, opacity: .6 });
  highlighted = r.teil ? teilLayers[r.teil.nr] : null;
  if (highlighted) highlighted.setStyle({ fillOpacity: .6, weight: 2.5, opacity: 1 });
  $("mode").textContent = source;

  // crossing notices (only while moving: live or Testlauf)
  if (moving && r.teil && lastTeil && r.teil.nr !== lastTeil) {
    toast(`Neuer Stadtteil: ${r.teil.nr} ${r.teil.name}`, r.viertel ? `Stadtviertel ${r.viertel.nr}` : "");
    try { navigator.vibrate && navigator.vibrate([90, 50, 90]); } catch (e) {}
    history = [];
  } else if (moving && r.viertel && lastViertel && r.viertel.nr !== lastViertel) {
    toast(`Neues Stadtviertel: ${r.viertel.nr}`, r.teil ? `weiterhin ${r.teil.name}` : "");
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  }
  lastTeil = r.teil ? r.teil.nr : null; lastViertel = r.viertel ? r.viertel.nr : null;

  const chips = $("chips"); chips.replaceChildren();
  if (r.teil) {
    $("swatch").style.background = COL[r.teil.b];
    $("bez").textContent = `Stadtbezirk ${r.bez ? r.bez.nr + " " + r.bez.name : ""}`;
    $("tnr").textContent = r.teil.nr; $("tname").textContent = r.teil.name;
    if (r.viertel) {
      chips.append(chip(`Viertel <b>${r.viertel.nr}</b>`));
      chips.append(r.viertel.nr.endsWith("9") ? chip("…9 · überwiegend unbewohnt", "green") : chip("Wohnviertel"));
      if (r.vborder)
        chips.append(chip(`Nächstes Viertel ${r.vborder.other.nr}: <b>${Math.round(r.vborder.d)} m</b>`));
    }
    let b = r.border, goal = false;
    if (target) {
      const n = nearestOnBoundary(pt, target.g);
      b = { d: n.d, p: n.p, bearing: bearingTo(pt, n.p), other: target, otherBez: null }; goal = true;
    }
    $("next").hidden = false;
    $("next").dataset.goal = String(goal);
    $("nextLbl").textContent = goal ? "Dein Ziel" : "Nächster Stadtteil";
    const tgt = b.other ? `${b.other.nr} ${b.other.name}` : (b.otherBez ? `Bezirk ${b.otherBez.name}` : "Stadtgrenze");
    $("nextTo").textContent = tgt;
    $("nextDir").textContent = `Richtung ${dirName(b.bearing)} · Luftlinie` + (b.other && b.other.b !== r.teil.b ? " · anderer Bezirk" : "");
    $("arrow").style.transform = `rotate(${Math.round(b.bearing)}deg)`;
    animateDistance(b.d);
    const prog = goal ? (targetStart > 0 ? 1 - b.d / targetStart : 1) : 1 - b.d / 200;
    $("bar").style.width = Math.max(2, Math.min(100, prog * 100)) + "%";
    $("next").dataset.state = b.d < 15 ? "edge" : b.d < 50 ? "near" : "calm";
    $("trend").textContent = trendText(b.d, moving);
    borderLine.setLatLngs([[pt[1], pt[0]], [b.p[1], b.p[0]]]);
    borderPt.setLatLng([b.p[1], b.p[0]]).addTo(map);
    renderNeighbours(neighbours(pt, r.teil));
  } else {
    $("next").hidden = true; borderLine.setLatLngs([]); borderPt.remove(); renderNeighbours([]);
    $("swatch").style.background = "var(--muted)"; $("tnr").textContent = "";
    if (r.bez) { $("bez").textContent = `Stadtbezirk ${r.bez.nr}`; $("tname").textContent = r.bez.name; chips.append(chip("Stadtteile hier nicht hinterlegt")); }
    else { $("bez").textContent = "Außerhalb von Stuttgart"; $("tname").textContent = "Kein Stadtgebiet"; }
  }
  $("src").textContent = accuracy
    ? `GPS-Genauigkeit ±${Math.round(accuracy)} m` + (r.border && r.border.d < accuracy ? " · Grenze liegt innerhalb der Ungenauigkeit" : "")
    : (source === "Testlauf" ? "Simulierter Spaziergang über die Heusteigstraße nach Norden. Tippe auf die Karte, um ein Ziel zu wählen." : "Wähle unten ein Ziel oder starte Live. Während Live wählt ein Tipp auf die Karte das Ziel.");
}

map.on("click", e => {
  const p = [e.latlng.lng, e.latlng.lat];
  if (watchId !== null || simTimer !== null) {
    const t = find(GEO.teile, p), cur = find(GEO.teile, lastPt);
    if (t && t !== cur) { setTarget(t, lastPt); render(lastPt, $("mode").textContent, 0, false); }
    return;
  }
  history = []; render(p, "Kartenpunkt");
});
$("nbs").addEventListener("click", e => {
  const b = e.target.closest(".nb"); if (!b) return;
  const t = GEO.teile.find(x => x.nr === b.dataset.nr);
  setTarget(target === t ? null : t, lastPt);
  render(lastPt, $("mode").textContent, 0, false);
});
$("clearTarget").addEventListener("click", () => { setTarget(null, lastPt); render(lastPt, $("mode").textContent, 0, false); });

// ---------- live GPS ----------
let watchId = null, follow = true, wake = null;
function setMsg(t) { $("msg").textContent = t || ""; $("msg").hidden = !t; }
async function startLive() {
  stopSim();
  if (!("geolocation" in navigator)) { setMsg("Dieser Browser liefert keinen Standort. Tippe auf die Karte oder nutze den Testlauf."); return; }
  setMsg(""); history = [];
  $("live").setAttribute("aria-pressed", "true"); $("live").classList.add("live"); $("liveTxt").textContent = "Live · stoppen";
  try { wake = await navigator.wakeLock?.request("screen"); } catch (e) { wake = null; }
  watchId = navigator.geolocation.watchPosition(p => {
    const pt = [p.coords.longitude, p.coords.latitude];
    render(pt, "Live", p.coords.accuracy, true);
    if (follow) map.panTo([pt[1], pt[0]], { animate: true });
  }, err => {
    stopLive();
    const where = location.protocol === "https:" ? "" : (/claude\.ai|claudeusercontent/.test(location.host) ? "claude" : "local");
    setMsg(err.code === 1
      ? (window.isSecureContext === false || where === "local"
          ? "Standort gesperrt: Diese Seite ist als lokale Datei geöffnet (" + location.protocol + "). Browser geben GPS nur an https-Adressen heraus. Öffne die Seite über ihre https-Adresse, z. B. GitHub Pages."
          : "Standortzugriff verweigert. In der Claude-App ist GPS gesperrt. Im Browser: Standort für diese Seite erlauben (Schloss-Symbol in der Adresszeile). Bis dahin: Karte antippen oder Testlauf.")
      : "Standort gerade nicht verfügbar. Versuche es draußen erneut oder tippe auf die Karte.");
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
function stopLive() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  $("live").setAttribute("aria-pressed", "false"); $("live").classList.remove("live"); $("liveTxt").textContent = "Live starten";
  try { wake && wake.release(); } catch (e) {} wake = null;
}

// ---------- Testlauf ----------
let simTimer = null;
function startSim() {
  stopLive(); setMsg(""); history = []; lastTeil = null; lastViertel = null;
  $("sim").setAttribute("aria-pressed", "true"); $("sim").textContent = "Testlauf stoppen";
  const pts = [];
  for (let i = 0; i < SIM_PATH.length - 1; i++) for (let k = 0; k < 12; k++) {
    const a = SIM_PATH[i], b = SIM_PATH[i + 1], t = k / 12;
    pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
  pts.push(SIM_PATH[SIM_PATH.length - 1]);
  let i = 0;
  const tick = () => {
    if (i >= pts.length) { stopSim(); return; }
    render(pts[i], "Testlauf", 0, true);
    if (follow) map.panTo([pts[i][1], pts[i][0]], { animate: true });
    i++; simTimer = setTimeout(tick, 650);
  };
  tick();
}
function stopSim() {
  clearTimeout(simTimer); simTimer = null;
  $("sim").setAttribute("aria-pressed", "false"); $("sim").textContent = "Testlauf";
}
function stopAll() { stopLive(); stopSim(); }

$("live").addEventListener("click", () => watchId === null ? startLive() : stopLive());
$("sim").addEventListener("click", () => simTimer === null ? startSim() : stopSim());
$("follow").addEventListener("click", () => {
  follow = !follow; $("follow").setAttribute("aria-pressed", String(follow));
  $("follow").textContent = follow ? "Folgen" : "Folgen aus";
});

render(DEMO, "Beispiel: Heusteigstraße 58");
</script>
</body></html>
